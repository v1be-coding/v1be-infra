# Run with plain Compose, not VS Code's Dev Containers feature, which can forward
# the host's Git credentials into the container.
name: v1be

services:
  dev:
    build: .
    image: v1be-dev
    working_dir: /workspaces/v1be
    command: bash
    stdin_open: true
    tty: true
    # Chromium runs out of room in Docker's default 64 MB.
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ../..
        target: /workspaces/v1be
      # Episode repos live here, where Windows can't reach their git hooks.
      - episodes:/workspaces/v1be/episodes
      - claude-config:/home/dev/.claude-config
      - gh-config:/home/dev/.config/gh
      - aws-config:/home/dev/.aws

volumes:
  episodes:
  claude-config:
  gh-config:
  aws-config:
