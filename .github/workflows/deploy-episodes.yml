# The user commits this file, because v1be-bot can't write workflows (ADR-0012).
# Only this and deploy.yml may name an environment. This repo's logs are
# public, and plan files are never uploaded.
name: deploy-episodes

on:
  push:
    branches: [main]
    paths:
      - stacks/episodes/**
      - stacks/episodes.tfvars
      - modules/episode/**
  workflow_dispatch: # A plan on demand. The environments still accept main alone.

permissions: {} # nothing unless a job asks

# A newer run replaces one waiting for approval, and never interrupts a running one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_PROFILE: portfolio # The backend signs in here. The café has its own provider.
  STACK: stacks/episodes
  TERRAFORM_VERSION: 1.17.1
  TERRAFORM_SHA256: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: plan
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # The checker comes from the commit before this one.
          persist-credentials: false
      - &check-text
        name: Check the change as text, before Terraform reads it
        run: |
          mkdir "$RUNNER_TEMP/base"
          git archive HEAD^ ci | tar -x -C "$RUNNER_TEMP/base"
          git diff --name-only --diff-filter=ACMRT HEAD^ HEAD > "$RUNNER_TEMP/changed.txt"
          bash "$RUNNER_TEMP/base/ci/check-pr-text.sh" "$PWD" "$RUNNER_TEMP/changed.txt"
      - &install
        name: Install Terraform at a fixed version
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "$TERRAFORM_SHA256  terraform.zip" | sha256sum -c -
          unzip -q terraform.zip terraform
          echo "$PWD" >> "$GITHUB_PATH"
      # AWS exchanges this token for each account's role. The profiles hold no
      # credentials, so none can reach the logs. The token lasts minutes.
      - &sign-in
        name: Point the AWS profiles at this environment's roles
        env:
          PORTFOLIO_ACCOUNT_ID: ${{ secrets.PORTFOLIO_ACCOUNT_ID }}
          CAFE_ACCOUNT_ID: ${{ secrets.CAFE_ACCOUNT_ID }}
        run: |
          [ -n "$PORTFOLIO_ACCOUNT_ID" ] && [ -n "$CAFE_ACCOUNT_ID" ] || { echo "An account ID secret is missing"; exit 1; }
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$token"
          printf %s "$token" > "$RUNNER_TEMP/oidc-token"
          mkdir -p ~/.aws
          for profile in "portfolio $PORTFOLIO_ACCOUNT_ID" "cafe $CAFE_ACCOUNT_ID"; do
            set -- $profile
            printf '[profile %s]\nrole_arn = arn:aws:iam::%s:role/v1be-infra-%s\nweb_identity_token_file = %s\n\n' \
              "$1" "$2" "$GITHUB_JOB" "$RUNNER_TEMP/oidc-token"
          done > ~/.aws/config
      - &init
        name: terraform init
        run: terraform -chdir="$STACK" init -lockfile=readonly
      - name: terraform plan
        id: plan
        env: &terraform-env
          TF_VAR_portfolio_account_id: ${{ secrets.PORTFOLIO_ACCOUNT_ID }}
          TF_VAR_cafe_account_id: ${{ secrets.CAFE_ACCOUNT_ID }}
        run: |
          code=0
          terraform -chdir="$STACK" plan -no-color -detailed-exitcode -lock-timeout=2m -var-file=../episodes.tfvars || code=$?
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apply # Waits here for the user's approval.
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout
      - *check-text
      - *install
      - *sign-in
      - *init
      - name: terraform apply
        env: *terraform-env
        run: terraform -chdir="$STACK" apply -no-color -auto-approve -lock-timeout=2m -var-file=../episodes.tfvars
